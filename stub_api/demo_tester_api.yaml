openapi: 3.0.0
info:
  title: Tester API
  version: "1.0"
paths:
  /tester/orders/{order_id}:
    get:
      operationId: get_order_by_id
      tags: [tester_db]
      security:
        - testingApiKey: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Order found
        "404":
          description: Order not found

components:
  securitySchemes:
    testingApiKey:
      type: apiKey
      in: header
      name: X-Testing-Api-Key
